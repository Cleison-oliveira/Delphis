[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delphis"
version = "1.0.0"
description = "Delphis: Dolphin Texture Manipulation Tool - Extraction, Tonemaps, Alpha Transparency, AI Upscaling & DDS Optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cleison Oliveira" },
    { name = "Delphis Contributors" }
]
keywords = ["dolphin", "emulator", "textures", "gamecube", "wii", "upscale", "dds", "tonemap", "nixos"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Games/Entertainment"
]
dependencies = [
    "PyQt6>=6.5.0",
    "Pillow>=9.5.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0"
]

[project.scripts]
delphis = "delphis.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["delphis*"]

[tool.setuptools.package-data]
delphis = ["assets/**/*", "assets/*", "assets/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
